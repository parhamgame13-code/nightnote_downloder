# CI پروژه NightDownloaderBot
# روی هر push/PR: تست‌ها (pytest) + لینت (ruff) اجرا می‌شن.
# تنظیمات ruff تو ruff.toml و تنظیمات pytest تو pytest.ini هست.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # همون نسخه‌ای که Dockerfile و سرور استفاده می‌کنن
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: تست‌ها (pytest)
        run: pytest tests/ -v

      - name: لینت (ruff)
        run: ruff check .
