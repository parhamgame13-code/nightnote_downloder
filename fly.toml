# Fly.io — دپلوی تک‌ماشینیِ NightNote (وب + بات + ورکر + beat).
#
# استفاده (بعد از `fly auth login`):
#   fly launch --no-deploy   # اگه اولین باره، یا اسم اپ رو این‌جا عوض کن
#   fly secrets set BOT_TOKEN="..." ADMIN_IDS="..." ADMIN_PASSWORD="..."
#   fly secrets set WEB_SECRET_KEY="$(openssl rand -hex 32)"
#   fly deploy
#
# ⚠️ اسم اپ (app) رو حتماً به یه اسم یکتای خودت تغییر بده.
# auto_stop_machines=false مهمه: وگرنه Fly ماشین رو با بیکاری متوقف
# می‌کنه و بات تلگرام می‌خوابه.
app = "nightnote-downloader"
primary_region = "fra"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

# دیسک دائمی (اختیاری ولی برای نگه‌داشتن دیتابیس/فایل‌ها توصیه می‌شه):
#   ۱) fly volumes create nightnote_data --size 10 --region fra
#   ۲) بلاک زیر رو uncomment کن
#   ۳) fly secrets set DATABASE_URL="sqlite+aiosqlite:////data/bot.db"
#      (و DIRECT_LINK_DIR رو هم به /data/direct_links تغییر بده)
# [[mounts]]
#   source = "nightnote_data"
#   destination = "/data"
